name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: openwec
          POSTGRES_PASSWORD: openwec
          POSTGRES_DB: openwec
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install pytest httpx respx
          pip install -e sdk/

      - name: Apply database schema
        run: |
          PGPASSWORD=openwec psql -h localhost -p 5433 -U openwec -d openwec -f database/schema.sql

      - name: Apply migrations
        run: |
          for f in database/migrations/*.sql; do
            case "$f" in *_down.sql) continue;; esac
            echo "applying $f"
            PGPASSWORD=openwec psql -h localhost -p 5433 -U openwec -d openwec -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply test fixtures
        run: |
          PGPASSWORD=openwec psql -h localhost -p 5433 -U openwec -d openwec -f tests/fixtures.sql

      - name: Run schema bootstrap tests
        run: pytest tests/schema/ -v
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          # The service container above is created and destroyed with this job.
          # Suites that write refuse to run without this declaration, because
          # nothing about a database's name or contents tells a disposable one
          # from the development instance, which has the same name and port.
          OPENWEC_TEST_DB_IS_DISPOSABLE: "1"

      - name: Run loader tests
        run: pytest tests/loader/ -v
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          OPENWEC_TEST_DB_IS_DISPOSABLE: "1"

      # The executor deletes rows, so it needs the real schema and the two
      # gates of tests/loader/sandbox.py: the disposable declaration, and the
      # refusal to run next to a database carrying the historical corpus.
      - name: Run deduplication executor tests
        run: pytest tests/execution/ -v -ra --strict-markers
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          OPENWEC_TEST_DB_IS_DISPOSABLE: "1"

      - name: Run enrichment guard tests (no DB needed)
        run: pytest tests/enrichment/test_merge_guard.py -v

      # A static sweep of the source for writers of `results`. It reads files
      # as text, opens no connection and imports no production module, so it
      # is deliberately given no database env.
      - name: Run repository guard tests (no DB needed)
        run: pytest tests/guards/ -v -ra --strict-markers

      # The team-normalization suite does need one: it merges teams and reads
      # back what stayed, and the foreign keys from `cars` and `entries` to
      # `teams` are what decide which merges fail. It runs in a schema of its
      # own, behind the two gates of tests/loader/sandbox.py.
      - name: Run team normalization tests
        run: pytest tests/enrichment/test_normalize_teams_exit_code.py -v -ra
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          OPENWEC_TEST_DB_IS_DISPOSABLE: "1"

      # The recovery suites of PRs #53-#59 had never run here: the job lists
      # its directories one by one and this one was simply missing from the
      # list. They were given no database on purpose, because none of them
      # opened a connection.
      #
      # One does now. `identity_twin` refuses to create a second car that
      # answers to an identity this session already uses, and the predicate
      # it refuses by reads `results` and `laps` — a fake cursor can only
      # assert the SQL, not that PostgreSQL agrees with it. So this step gets
      # the same service container and the same disposable declaration the
      # loader step uses, and the suite runs in a schema of its own.
      #
      # The step below still treats a skip as an error, which is what makes
      # this env necessary rather than optional: without it the guard suite
      # would skip itself and the failure would be silent.
      - name: Run recovery assessment tests
        run: |
          pytest tests/recovery/ -v -ra --strict-markers \
            --junitxml=recovery-results.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          OPENWEC_TEST_DB_IS_DISPOSABLE: "1"

      # pytest exits non-zero on a failure and on an empty collection, but
      # it exits zero on a test that quietly skipped itself. This suite is
      # pure unit tests over a fake cursor: a skip here means something
      # regressed, so it is an error until someone declares otherwise.
      - name: Report recovery test counts
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse("recovery-results.xml").getroot()
          suite = raiz if raiz.tag == "testsuite" else raiz.find("testsuite")
          n = {k: int(suite.get(k, 0))
               for k in ("tests", "failures", "errors", "skipped")}
          aprovados = n["tests"] - n["failures"] - n["errors"] - n["skipped"]
          print(f"collected {n['tests']}  passed {aprovados}  "
                f"failed {n['failures']}  errors {n['errors']}  "
                f"skipped {n['skipped']}")
          if n["tests"] == 0:
              sys.exit("nenhum teste de recuperacao foi coletado")
          if n["failures"] or n["errors"]:
              sys.exit(f"{n['failures']} falha(s) e {n['errors']} erro(s) "
                       f"na suite de recuperacao")
          if n["skipped"]:
              sys.exit(f"{n['skipped']} teste(s) de recuperacao foram "
                       f"ignorados; esta suite nao deve ignorar nenhum")
          PY

      - name: Run SDK tests (no DB needed)
        run: pytest tests/sdk/ -v

      - name: Start API server
        run: |
          uvicorn api.main:app --port 8000 &
          sleep 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: openwec
          DB_USER: openwec
          DB_PASSWORD: openwec
          API_KEYS: ""

      - name: Run API tests
        run: pytest tests/api/ -v -k "not stints_with_key and not pace_with_key and not race_control_with_key"
        env:
          BASE_URL: http://localhost:8000
          TEST_EVENT_ID: 1
          TEST_SESSION_ID: 1
          TEST_DRIVER_ID: 1
          TEST_TEAM_ID: 1