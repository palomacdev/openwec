# OpenWEC — Local Development
# Production uses a separate compose on the VM with env_file.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d 
#   docker compose -f docker/docker-compose.yml down 


services:

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: openwec-db
    restart: unless-stopped

    # How long Postgres gets to finish its checkpoint before Docker sends
    # SIGKILL. The image's stop signal is SIGINT, which Postgres reads as a
    # fast shutdown: it still has to flush and write the shutdown checkpoint.
    #
    # Without this line the container inherits whatever the daemon decides.
    # Measured on this machine, that was `StopTimeout=1` -- one second for a
    # 1.2 GB cluster -- on every container, not just this one. The log of the
    # historical copy showed 25 starts reporting `database system was not
    # properly shut down; automatic recovery in progress` against a single
    # clean shutdown. WAL replay has carried it every time, which is luck
    # repeated rather than a design.
    #
    # Two minutes is not a wait; it is a ceiling. A healthy shutdown of this
    # cluster takes seconds, and the container stops as soon as the process
    # exits.
    stop_grace_period: 2m

    environment:
      POSTGRES_USER:     ${DB_USER:-openwec}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openwec}
      POSTGRES_DB:       ${DB_NAME:-openwec}
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    ports:
      # The host interface is written here, literally, and is not a variable.
      #
      # Without one, Docker publishes on 0.0.0.0 and ::, and this database
      # answers to anyone who can reach the machine on this port -- with the
      # development superuser and the development password, which are both
      # `openwec` and both written above.
      #
      # Measured on the machine where this was found, from that machine: the
      # port published on 0.0.0.0 accepted a connection on the Wi-Fi address
      # and a port published on 127.0.0.1 refused the same one. That is what
      # the binding does. It is NOT a measurement from another machine -- the
      # host firewall there happened to block inbound to the Docker backend,
      # so the exposure was latent rather than live. Latent is not a reason
      # to leave it: the firewall is one network-category change away from
      # not applying, and this line is the part that does not depend on it.
      #
      # It was briefly a `${DB_BIND_HOST:-127.0.0.1}` variable. That is a
      # wider default one environment variable away, set by a stray export or
      # an inherited shell, with no diff to review and nothing on screen to
      # say it happened. The port stays where it can be read.
      #
      # If you genuinely need the database from another interface -- from WSL,
      # say -- do not change this line. Write an override file and pass it
      # explicitly, so that reaching outside the machine is one visible
      # command rather than an ambient variable:
      #
      #   # docker/docker-compose.expose.yml   (untracked, yours)
      #   services:
      #     db:
      #       ports: !override ["172.30.224.1:${DB_PORT:-5433}:5432"]
      #
      #   docker compose -f docker/docker-compose.yml       #                  -f docker/docker-compose.expose.yml up -d
      #
      # No consumer in this repository needs that: every one uses localhost,
      # no container shares a network with `openwec-db`, and CI runs its own
      # service container.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openwec} -d ${DB_NAME:-openwec}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: