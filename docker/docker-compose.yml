# OpenWEC — Local Development
# Production uses a separate compose on the VM with env_file.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d 
#   docker compose -f docker/docker-compose.yml down 


services:

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: openwec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-openwec}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openwec}
      POSTGRES_DB:       ${DB_NAME:-openwec}
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    ports:
      # The host interface is written here, literally, and is not a variable.
      #
      # Without one, Docker publishes on 0.0.0.0 and ::, and this database
      # answers to anyone who can reach the machine on this port -- with the
      # development superuser and the development password, which are both
      # `openwec` and both written above. Measured on the machine where this
      # was found: it authenticated over the Wi-Fi address.
      #
      # It was briefly a `${DB_BIND_HOST:-127.0.0.1}` variable. That is a
      # wider default one environment variable away, set by a stray export or
      # an inherited shell, with no diff to review and nothing on screen to
      # say it happened. The port stays where it can be read.
      #
      # If you genuinely need the database from another interface -- from WSL,
      # say -- do not change this line. Write an override file and pass it
      # explicitly, so that reaching outside the machine is one visible
      # command rather than an ambient variable:
      #
      #   # docker/docker-compose.expose.yml   (untracked, yours)
      #   services:
      #     db:
      #       ports: !override ["172.30.224.1:${DB_PORT:-5433}:5432"]
      #
      #   docker compose -f docker/docker-compose.yml       #                  -f docker/docker-compose.expose.yml up -d
      #
      # No consumer in this repository needs that: every one uses localhost,
      # no container shares a network with `openwec-db`, and CI runs its own
      # service container.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openwec} -d ${DB_NAME:-openwec}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: