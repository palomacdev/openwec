# OpenWEC — Deployment
#
# Reference compose file for running OpenWEC as a deployed service: the API
# built from the Dockerfile in this repository, TimescaleDB for storage, and
# Redis for rate limiting.
#
# The database password comes from DB_PASSWORD in .env. No literal credential
# belongs in this file, which is public. See .env.example.
#
# Usage (read VOLUME NAMING below before the first run):
#   docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANT — VOLUME NAMING
#   Compose prefixes volume names with the project name, which defaults to the
#   directory name. Running this file from a directory with a different name
#   than the one used before creates a NEW, EMPTY volume, and the database will
#   appear blank. Keep the directory name stable, or pass -p <project>
#   explicitly. This file deliberately does not set a project name.
#
# IMAGE TAGS
#   "latest-pg16" and "7-alpine" are mutable: the image behind either tag
#   changes over time, so two deployments of this file can end up on different
#   builds. Pinning by digest only stays portable across architectures if the
#   digest is a manifest index rather than a platform-specific manifest.
#   Requirements: PostgreSQL 16 with TimescaleDB 2.x, and Redis 7.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: openwec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwec
      # Comes from the environment, or from the .env file sitting next to this
      # compose file. Must be the same value the api service reads from .env.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: openwec
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: .
    container_name: openwec-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"

  redis:
    image: redis:7-alpine
    container_name: openwec-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
